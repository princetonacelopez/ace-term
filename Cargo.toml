[workspace]
resolver = "3"
members = [
    "crates/ace-vt",
    "crates/ace-pty",
    "crates/ace-shell",
    "crates/ace-env",
    "crates/ace-agent",
    "crates/ace-config",
    "crates/ace-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ace-vt = { path = "crates/ace-vt" }
ace-pty = { path = "crates/ace-pty" }
ace-shell = { path = "crates/ace-shell" }
ace-env = { path = "crates/ace-env" }
ace-agent = { path = "crates/ace-agent" }
ace-config = { path = "crates/ace-config" }

alacritty_terminal = "0.26"
anyhow = "1"
arc-swap = "1"
dirs = "6"
futures-util = "0.3"
gix = { version = "0.90", features = ["status"] }
gpui-kit = "0.9"
imara-diff = "0.2"
keyring = "3"
notify = "8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-pty = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
unicode-normalization = "0.1"
